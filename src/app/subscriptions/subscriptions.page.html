<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-title>Subscriptions Management</ion-title>
    <ion-button slot="end" (click)="addSubscription()">
      <ion-icon slot="start" name="add-circle"></ion-icon>
      Add Subscription
    </ion-button>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Subscriptions Management</ion-title>
    </ion-toolbar>
  </ion-header>
</ion-content>
