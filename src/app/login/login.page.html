

<ion-content [fullscreen]="true">
<ion-grid>
  <ion-row>
    <ion-col size="4" offset="4">
      <ion-card color="light">
        <ion-card-header>
          <ion-card-subtitle>Login with your admin credentials to continue</ion-card-subtitle>
          <ion-card-title>Magic Formula Admin</ion-card-title>
        </ion-card-header>
        <ion-card-content>
          <form [formGroup]="form" (ngSubmit)="onSubmit()">
              <ion-input fill="outline" label="Email" label-placement="floating" 
               required formControlName="email" type="email">
              <ion-icon slot="start" name="mail"></ion-icon>
              </ion-input>
              <br>
              <ion-input fill="outline" label="Password" label-placement="floating" 
               required formControlName="password" type="password">
              <ion-icon slot="start" name="shield-checkmark"></ion-icon>
              </ion-input>
            <br>
              <ion-button mode="ios" fill="solid" expand="block" color="primary" type="submit" [disabled]="form.invalid">
              Login
            </ion-button>
          </form>
        </ion-card-content>
      </ion-card>
    </ion-col>
  </ion-row>
</ion-grid>
</ion-content>
